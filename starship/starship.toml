"$schema" = 'https://starship.rs/config-schema.json'

# Minimal look: no colored backgrounds, arrows or icons
format = "$username$hostname$directory$git_branch$git_state$git_status$python$cmd_duration$line_break$character"
add_newline = true
command_timeout = 500
palette = "gruvbox_material"

[username]
show_always = true
format = "[$user]($style)[@](grey)"
style_user = "yellow"
style_root = "bold red"

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "orange"

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " ro"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "fg"
format = "[$branch]($style)"

[git_state]
style = "grey"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
style = "aqua"
format = "([$all_status$ahead_behind]($style)) "
modified = "*"
staged = "+"
untracked = "?"
deleted = "x"
stashed = "≡"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"

[python]
symbol = ""
style = "grey"
format = '[(\($virtualenv\) )]($style)'

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[palettes.gruvbox_material]
fg = "#d4be98"
grey = "#928374"
red = "#ea6962"
orange = "#e78a4e"
yellow = "#d8a657"
green = "#a9b665"
aqua = "#89b482"
blue = "#7daea3"
purple = "#d3869b"

